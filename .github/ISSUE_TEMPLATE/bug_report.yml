name: Bug report
description: Report a visual or functional problem with the skin
title: "[bug] "
labels: [bug]
body:
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [Light, Dark]
    validations:
      required: true
  - type: input
    id: viewport
    attributes:
      label: Viewport
      description: e.g. 1440x900 desktop, 390x844 mobile
  - type: textarea
    id: description
    attributes:
      label: What's wrong?
      description: Describe the issue and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Paste or link a screenshot — this project is visual.
  - type: input
    id: version
    attributes:
      label: DSH version
      description: Output of `dsh --version`
